<style>
  :root{
    --bg:#14100d;
    --bg-alt:#1c1611;
    --surface:#241b14;
    --surface-2:#2c2118;
    --text:#f6efe4;
    --text-mute:#b7a996;
    --red:#c1272d;
    --red-deep:#8f1c21;
    --gold:#d9a441;
    --saffron:#e58a2a;
    --green:#1e6b4f;
    --border:rgba(246,239,228,0.10);
    --display:'Yatra One', cursive;
    --body:'Hind', sans-serif;
    --radius:2px;
    --shadow:0 18px 40px -20px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.6;
    overflow-x:hidden;
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit; cursor:pointer;}
  .container{max-width:1180px; margin:0 auto; padding:0 24px;}
  h1,h2,h3{font-family:var(--display); font-weight:400; letter-spacing:0.3px;}
  section{padding:96px 0;}
  @media(max-width:720px){ section{padding:64px 0;} .container{padding:0 20px;} }

  .tricolor-rule{
    height:3px; width:64px; margin:18px 0 28px;
    background:linear-gradient(90deg, var(--saffron) 0 33%, var(--text) 33% 66%, var(--green) 66% 100%);
    border-radius:1px;
  }
  .center .tricolor-rule{ margin-left:auto; margin-right:auto; }

  .eyebrow-none{ /* deliberately no all-caps tracked eyebrows per design guidance */ }

  /* ---------- Header ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:1000;
    background:rgba(20,16,13,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    transition:background .3s ease;
  }
  .nav-wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; max-width:1180px; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(180deg, var(--saffron), var(--text) 50%, var(--green));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); color:var(--bg); font-size:18px;
  }
  .brand-name{font-family:var(--display); font-size:20px; letter-spacing:.5px;}

  .nav-links{display:flex; gap:32px; align-items:center;}
  .nav-links a{
    font-size:15.5px; color:var(--text-mute); position:relative; padding:6px 0;
    transition:color .25s ease;
  }
  .nav-links a:hover, .nav-links a.active{color:var(--text);}
  .nav-links a::after{
    content:''; position:absolute; left:0; bottom:0; height:2px; width:0;
    background:var(--gold); transition:width .25s ease;
  }
  .nav-links a:hover::after, .nav-links a.active::after{width:100%;}

  .lang-switch{
    display:flex; align-items:center; gap:2px;
    border:1px solid var(--border); border-radius:20px; padding:3px;
    background:rgba(255,255,255,0.02);
  }
  .lang-switch button{
    border:none; background:transparent; color:var(--text-mute);
    font-family:var(--body); font-size:13.5px; font-weight:600;
    padding:6px 12px; border-radius:16px; transition:all .25s ease;
  }
  .lang-switch button.active{background:var(--red); color:#fff;}

  .hamburger{display:none; flex-direction:column; gap:5px; background:none; border:none; padding:8px;}
  .hamburger span{width:24px; height:2px; background:var(--text);}

  .mobile-panel{
    display:none; flex-direction:column; gap:0;
    background:var(--bg-alt); border-top:1px solid var(--border);
  }
  .mobile-panel.open{display:flex;}
  .mobile-panel a{padding:16px 24px; border-bottom:1px solid var(--border); color:var(--text-mute); font-size:16px;}
  .mobile-panel .lang-switch{margin:16px 24px 20px;}

  @media(max-width:860px){
    .nav-links{display:none;}
    .hamburger{display:flex;}
    .lang-switch.desktop-only{display:none;}
  }

  /* ---------- Hero ---------- */
  .hero{
    min-height:100vh; display:flex; align-items:center; position:relative;
    padding-top:96px;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(193,39,45,0.16), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(217,164,65,0.12), transparent 55%),
      linear-gradient(180deg, #171009, #0f0c09 70%);
  }
  @media(max-width:720px){
    /* A tall, narrow mobile screen forces object-fit:cover to zoom a wide
       photo in heavily. Shortening the hero on mobile brings its aspect
       ratio closer to the photo's, so less of it needs to be cropped. */
    .hero{min-height:74vh;}
  }
  .hero::before{
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(20,16,13,0.55), rgba(20,16,13,0.85)),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 40px);
    z-index:1;
  }
  .hero-inner{position:relative; z-index:2; max-width:760px;}
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:8px; color:var(--gold);
    font-size:15px; margin-bottom:18px;
  }
  .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
  .hero h1{
    font-size:clamp(48px, 9vw, 92px); line-height:1;
    background:linear-gradient(180deg, #fff, #e7d8bd 60%, var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-tagline{
    font-size:clamp(18px, 2.4vw, 24px); color:var(--text-mute); margin-top:22px; max-width:520px;
    font-style:italic;
  }
  .hero-actions{display:flex; flex-wrap:wrap; gap:14px; margin-top:40px;}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:15px 28px; border-radius:2px; font-size:15.5px; font-weight:600;
    border:1px solid transparent; transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--red); color:#fff; box-shadow:0 10px 30px -10px rgba(193,39,45,0.6);}
  .btn-gold{background:var(--gold); color:#241b14; box-shadow:0 10px 30px -10px rgba(217,164,65,0.5);}
  .btn-outline{border-color:var(--border); color:var(--text); background:rgba(255,255,255,0.03);}
  .btn svg{width:18px; height:18px; flex-shrink:0;}

  .scroll-cue{
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    color:var(--text-mute); font-size:13px; display:flex; flex-direction:column; align-items:center; gap:8px;
    z-index:2;
  }
  .scroll-cue .line{width:1px; height:34px; background:linear-gradient(var(--gold), transparent);}

  /* ---------- Section heads ---------- */
  .section-head{max-width:640px; margin-bottom:48px;}
  .section-head h2{font-size:clamp(32px,4.5vw,46px);}
  .section-head p{color:var(--text-mute); font-size:17px; margin-top:6px;}

  /* ---------- About ---------- */
  .about-grid{display:grid; grid-template-columns:1fr 1.1fr; gap:64px; align-items:center;}
  @media(max-width:860px){ .about-grid{grid-template-columns:1fr; gap:36px;} }
  .about-visual{
    aspect-ratio:4/5; border-radius:2px; position:relative; overflow:hidden;
    background:linear-gradient(160deg, var(--surface), var(--bg-alt));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .about-visual .frame-label{
    color:var(--text-mute); font-size:14px; text-align:center; padding:24px;
  }
  .about-text p{font-size:18px; color:#e6d9c6; max-width:52ch;}
  .about-stats{display:flex; gap:40px; margin-top:36px;}
  .about-stats div span{display:block; font-family:var(--display); font-size:34px; color:var(--gold);}
  .about-stats div small{color:var(--text-mute); font-size:13.5px;}

  /* ---------- Menu ---------- */
  .menu-tabs{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:40px;}
  .menu-tab{
    padding:10px 20px; border:1px solid var(--border); border-radius:20px;
    color:var(--text-mute); font-size:14.5px; font-weight:600; background:rgba(255,255,255,0.02);
    transition:all .2s ease;
  }
  .menu-tab.active{background:var(--red); border-color:var(--red); color:#fff;}
  .menu-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:22px;}
  .menu-card{
    background:var(--surface); border:1px solid var(--border); border-radius:2px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .menu-card-photo{
    aspect-ratio:4/3; background:linear-gradient(150deg, var(--surface-2), var(--bg-alt));
    display:flex; align-items:center; justify-content:center; color:var(--text-mute); font-size:13px;
    border-bottom:1px solid var(--border);
  }
  .menu-card-photo .fallback-hide{display:flex; align-items:center; justify-content:center; width:100%; height:100%;}
  .menu-card-body{padding:18px 20px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .menu-card-body h4{font-family:var(--body); font-weight:600; font-size:16.5px;}
  .menu-card-body .price{color:var(--gold); font-weight:700; font-size:16px; white-space:nowrap;}
  .menu-note{color:var(--text-mute); font-size:14px; margin-top:28px;}

  /* ---------- Offers ---------- */
  .offer-card{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:24px;
    background:linear-gradient(120deg, rgba(193,39,45,0.14), rgba(217,164,65,0.08));
    border:1px solid var(--border); border-radius:2px; padding:44px;
  }
  .offer-card h3{font-size:28px; margin-bottom:8px;}
  .offer-card p{color:var(--text-mute); max-width:44ch;}
  .offer-badge{
    background:var(--gold); color:#241b14; font-weight:700; font-size:15px;
    padding:12px 22px; border-radius:2px; white-space:nowrap;
  }

  /* ---------- Gallery ---------- */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); grid-auto-rows:150px; gap:14px;
  }
  .gallery-grid .g-item:nth-child(1){grid-column:span 2; grid-row:span 2;}
  .gallery-grid .g-item:nth-child(4){grid-column:span 2;}
  .gallery-grid .g-item:nth-child(6){grid-column:span 2; grid-row:span 2;}
  @media(max-width:720px){
    .gallery-grid{grid-template-columns:repeat(2,1fr); grid-auto-rows:130px;}
    .gallery-grid .g-item:nth-child(1){grid-column:span 2; grid-row:span 1;}
    .gallery-grid .g-item:nth-child(6){grid-row:span 1;}
  }
  .g-item{
    background:linear-gradient(150deg, var(--surface), var(--bg-alt));
    border:1px solid var(--border); border-radius:2px; position:relative; overflow:hidden;
    display:flex; align-items:flex-end; padding:12px;
  }
  .g-item span{
    color:var(--text-mute); font-size:12.5px; background:rgba(20,16,13,0.7);
    padding:4px 9px; border-radius:12px;
  }

  /* ---------- Why choose us ---------- */
  .why-list{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--border); border:1px solid var(--border);}
  @media(max-width:720px){ .why-list{grid-template-columns:1fr;} }
  .why-item{background:var(--bg); padding:32px; display:flex; gap:18px; align-items:flex-start;}
  .why-item .icon{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--gold); color:var(--gold);
    display:flex; align-items:center; justify-content:center;
  }
  .why-item h4{font-family:var(--body); font-size:17px; font-weight:600; margin-bottom:4px;}
  .why-item p{color:var(--text-mute); font-size:14.5px;}

  /* ---------- Contact ---------- */
  .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:56px;}
  @media(max-width:860px){ .contact-grid{grid-template-columns:1fr; gap:36px;} }
  .contact-card{background:var(--surface); border:1px solid var(--border); padding:36px; border-radius:2px;}
  .contact-row{display:flex; gap:16px; padding:16px 0; border-bottom:1px solid var(--border);}
  .contact-row:last-child{border-bottom:none;}
  .contact-row .icon{color:var(--gold); flex-shrink:0; margin-top:2px;}
  .contact-row h5{font-size:13.5px; color:var(--text-mute); font-weight:600; margin-bottom:4px;}
  .contact-row p, .contact-row a{font-size:16px;}
  .map-frame{border:1px solid var(--border); border-radius:2px; overflow:hidden; height:100%; min-height:340px;}
  .map-frame iframe{width:100%; height:100%; min-height:340px; border:0; filter:grayscale(0.3) invert(0.92) contrast(0.9);}

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--border); padding:56px 0 28px; background:var(--bg-alt);}
  .footer-grid{display:flex; flex-wrap:wrap; justify-content:space-between; gap:32px; margin-bottom:40px;}
  .footer-brand p{color:var(--text-mute); max-width:34ch; margin-top:10px; font-size:14.5px;}
  .footer-col h5{font-size:14px; color:var(--text-mute); margin-bottom:14px;}
  .footer-col a{display:block; color:var(--text); font-size:14.5px; margin-bottom:10px; opacity:.85;}
  .footer-bottom{
    border-top:1px solid var(--border); padding-top:24px; display:flex; flex-wrap:wrap;
    justify-content:space-between; gap:10px; color:var(--text-mute); font-size:13px;
  }

  /* ---------- WhatsApp float ---------- */
  .wa-float{
    position:fixed; bottom:24px; right:24px; z-index:900;
    width:58px; height:58px; border-radius:50%; background:#25D366;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 26px -8px rgba(0,0,0,0.6);
    animation:pulse-wa 2.6s ease-in-out infinite;
  }
  @keyframes pulse-wa{
    0%,100%{box-shadow:0 12px 26px -8px rgba(0,0,0,0.6), 0 0 0 0 rgba(37,211,102,0.5);}
    50%{box-shadow:0 12px 26px -8px rgba(0,0,0,0.6), 0 0 0 10px rgba(37,211,102,0);}
  }
  .wa-float svg{width:30px; height:30px;}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .wa-float{animation:none;}
    *{transition:none !important; animation-duration:0.01ms !important;}
  }

  ::selection{background:var(--red); color:#fff;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  /* ============================================================
     PHOTO SLOTS
     Every real photo on this site (hero background, about, menu
     cards, gallery) uses this pattern: an <img class="site-photo">
     sits inside a positioned container that already has a
     placeholder look. Until the file at the given src actually
     exists, the browser fires an "error" event and the image stays
     hidden (display:none) — so the layout and design never break
     or show a broken-image icon. The moment a correctly-named file
     is dropped into /images/, it loads and quietly replaces the
     placeholder with zero code changes. See images/PUT-PHOTOS-HERE.txt.
     ============================================================ */
  .photo-slot{position:relative; overflow:hidden;}
  .photo-slot .site-photo{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    display:none; /* JS reveals this only after a successful load */
  }
  .photo-slot .fallback-hide{position:relative; z-index:1;}

  .hero-bg-photo{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center 30%; z-index:0; display:none;
  }
</style>
</head>
